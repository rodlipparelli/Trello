<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subtarefas & Hierarquia</title>
  <link rel="stylesheet" href="./css/style.css">
  <!-- Trello Power-Up Client Library -->
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <div id="container">
    <!-- Seção do Card Pai (Exibida quando este card tem um pai) -->
    <div id="parent-container" class="parent-container" style="display: none;">
      <div class="parent-banner">
        <div class="parent-info">
          <span class="parent-icon">↳</span>
          <span>Subtarefa de: <a id="parent-card-link" class="parent-link" href="#" target="_blank">Card Mestre</a></span>
        </div>
        <div class="parent-actions">
          <button id="change-parent-btn" class="action-btn-sm" type="button" title="Alterar card pai">Alterar</button>
          <button id="unlink-parent-btn" class="action-btn-sm danger" type="button" title="Desvincular deste card mestre">Desvincular</button>
        </div>
      </div>
    </div>

    <!-- Botão para definir card pai quando o card não tiver um -->
    <div id="add-parent-row" class="add-parent-row">
      <button id="add-parent-btn" class="add-parent-btn" type="button">
        <span>↳</span> Definir Tarefa Pai (Add Parent)
      </button>
    </div>

    <!-- Seção de Subtarefas do Card Atual -->
    <div class="subtasks-section">
      <div class="subtasks-header">
        <div class="subtasks-title-wrapper">
          <svg class="subtasks-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"></polyline>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
          <span class="subtasks-title">Subtarefas</span>
        </div>
        <span id="progress-stats" class="progress-stats">0 de 0 (0%)</span>
      </div>

      <!-- Barra de Medidor de Progresso -->
      <div id="progress-bar-container" class="progress-bar-container" style="display: none;">
        <div class="progress-bar-track">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
        <span id="progress-percentage" class="progress-percentage">0%</span>
      </div>

      <!-- Lista de Cards Subtarefas Vinculados -->
      <ul id="subtasks-list" class="subtasks-list"></ul>
      <div id="empty-state" class="empty-state" style="display: none;">Nenhum card subtarefa atrelado ainda.</div>

      <!-- Formulário de Criação de Novo Card como Subtarefa com Destino de Lista -->
      <div class="create-card-section">
        <form id="create-card-form" class="create-form-fields">
          <input
            type="text"
            id="subtask-card-title"
            class="subtask-input"
            placeholder="Criar novo cartão subtarefa..."
            autocomplete="off"
            required
          />

          <div class="select-row">
            <label for="target-list-select" class="destination-label">Criar na lista:</label>
            <select id="target-list-select" class="target-list-select"></select>
            <button type="submit" id="create-btn" class="primary-btn">+ Criar Cartão</button>
          </div>
        </form>
      </div>

      <!-- Ações Extras: Vincular Card Existente e Alternar Tema -->
      <div class="bottom-actions">
        <button id="link-existing-card-btn" class="secondary-btn" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          Vincular Card Existente (Add Subtask)
        </button>

        <button id="toggle-theme-btn" class="toggle-theme-btn" type="button" title="Alternar tema claro/escuro">
          <span id="theme-icon">☀️</span> <span id="theme-label">Tema</span>
        </button>
      </div>
    </div>
  </div>

  <script src="./js/card-back.js"></script>
</body>
</html>
